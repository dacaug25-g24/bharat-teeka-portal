spring.application.name=patient-service
# Server
server.port=8082

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/p24_bharat_teeka_portal
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# hospital-service base url
#hospital.service.base-url=http://localhost:8081

jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_32CHARS_MINIMUM_ABCDEFGHIJKLMNOPQRSTUVWXYZ123456

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

hospital.service.base-url=http://localhost:9090
hospital.service.vaccinations-path=/hospital/vaccinations/patient/{patientId}

# timeouts
hospital.service.timeout-ms=2000
